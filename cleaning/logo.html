<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Que La Femme — Brand Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0d0e11;--charcoal:#16181d;--steel:#767c86;--mist:#b9bec6;--platinum:#e9ebee;--line:rgba(255,255,255,.12);}
  *{box-sizing:border-box;margin:0;}
  body{font-family:"Inter",sans-serif;background:var(--ink);color:var(--platinum);padding:56px 24px 90px;}
  .head{max-width:960px;margin:0 auto 44px;text-align:center;}
  .head h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:2rem;color:#fff;}
  .head p{color:var(--steel);margin-top:10px;font-size:.95rem;}
  .grid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);}
  .cell{background:var(--ink);padding:56px 32px;display:grid;place-items:center;min-height:230px;position:relative;}
  .cell .tag{position:absolute;top:16px;left:20px;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--steel);}
  /* primary lockup */
  .lockup{display:flex;align-items:center;gap:16px;}
  .lockup .mk{width:52px;height:52px;border:1px solid var(--steel);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:1.9rem;color:#fff;}
  .lockup .wm{font-family:"Cormorant Garamond",serif;font-size:1.7rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;}
  /* stacked wordmark */
  .stack{text-align:center;font-family:"Cormorant Garamond",serif;color:#fff;line-height:1.02;}
  .stack .q{font-size:2.5rem;letter-spacing:.04em;}
  .stack .l{font-style:italic;color:var(--mist);font-size:1.3rem;margin:2px 0;}
  .stack .f{font-size:2.5rem;letter-spacing:.04em;}
  .stack .r{width:56px;height:1px;background:var(--steel);margin:14px auto 10px;}
  .stack .t{font-family:"Inter",sans-serif;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--steel);padding-left:.34em;}
  /* monogram tile */
  .tile{width:96px;height:96px;border:1px solid var(--steel);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:3.4rem;color:#fff;}
  /* favicon row */
  .favs{display:flex;gap:18px;align-items:center;}
  .fav{width:56px;height:56px;border:1px solid var(--steel);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;color:#fff;}
  .fav.sm{width:32px;height:32px;font-size:1.1rem;}
  .fav.md{width:44px;height:44px;font-size:1.5rem;}
  .fav.lg{font-size:1.9rem;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <div class="head">
    <h1>Que La Femme — Brand Mark</h1>
    <p>The finished mark, cold palette. This is what's live in the site header, the favicon, and the share image.</p>
  </div>
  <div class="grid">
    <div class="cell"><span class="tag">Primary lockup</span>
      <div class="lockup"><span class="mk">Q</span><span class="wm">Que&nbsp;La&nbsp;Femme</span></div>
    </div>
    <div class="cell"><span class="tag">Stacked wordmark</span>
      <div class="stack"><div class="q">QUE</div><div class="l">la</div><div class="f">FEMME</div><div class="r"></div><div class="t">Toronto Home Care</div></div>
    </div>
    <div class="cell"><span class="tag">Monogram</span>
      <div class="tile">Q</div>
    </div>
    <div class="cell"><span class="tag">Favicon / avatar sizes</span>
      <div class="favs"><span class="fav sm">Q</span><span class="fav md">Q</span><span class="fav lg">Q</span></div>
    </div>
  </div>
</body>
</html>
