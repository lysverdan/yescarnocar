name: IndexNow submit

# Pings Bing/IndexNow after every deploy so new and changed pages get
# recrawled quickly. The IndexNow key is public by design (it is hosted at
# https://yescarnocar.com/f0097ade8dcb5450ce8153b75cb4de38.txt), so it is
# safe to keep in this file — ownership is proven by that key file, not by
# keeping the key secret.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, urllib.error, sys
          urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml', encoding='utf-8').read())
          if not urls:
              print('No URLs found in sitemap.xml'); sys.exit(1)
          payload = {
              "host": "yescarnocar.com",
              "key": "f0097ade8dcb5450ce8153b75cb4de38",
              "keyLocation": "https://yescarnocar.com/f0097ade8dcb5450ce8153b75cb4de38.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode('utf-8'),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow accepted: HTTP {r.status} — {len(urls)} URLs submitted")
          except urllib.error.HTTPError as e:
              print(f"IndexNow HTTP {e.code}: {e.read().decode('utf-8', 'replace')[:300]}")
              sys.exit(1)
          PY
